name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build
      - run: zig build test

  modes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [standalone, multicall, all]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build -Dmode=${{ matrix.mode }} -Doptimize=ReleaseSafe
      - name: Run the multicall binary
        if: matrix.mode != 'standalone'
        run: zig-out/bin/util-unix uname --version

  cross:
    # Compile check only: nothing is run or published from these builds.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
        mode: [standalone, multicall]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build -Dtarget=${{ matrix.target }} -Dmode=${{ matrix.mode }} -Doptimize=ReleaseSafe
