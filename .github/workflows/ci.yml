name: ci

on:
  push:
    branches: ['**']   # tags run this through release.yml
  pull_request:
  workflow_call:       # release.yml runs every job before it builds

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build
      - run: zig build test

  suites:
    # The differential, diagnostic and pty suites (see scripts/ci-suites.sh).
    # Static binaries built here run in the container that holds the references.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe
      - name: Allow the sandbox the root-directory tests need
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run the suites
        run: >-
          docker run --rm
          --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
          -v "$PWD:/src:ro" ubuntu:26.04 sh /src/scripts/ci-suites.sh

  modes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [standalone, multicall, all]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build -Dmode=${{ matrix.mode }} -Doptimize=ReleaseSafe
      - name: Run the multicall binary
        if: matrix.mode != 'standalone'
        run: zig-out/bin/util-unix uname --version

  cross:
    # Compile check only: nothing is run or published from these builds.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
        mode: [standalone, multicall]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build -Dtarget=${{ matrix.target }} -Dmode=${{ matrix.mode }} -Doptimize=ReleaseSafe
